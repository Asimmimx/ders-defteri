{% extends "portal/base.html" %}
{% block title %}Şifre değiştir{% endblock %}
{% block content %}
<h1>Şifre değiştir</h1>
<div class="card" style="max-width:440px;margin-top:14px">
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="field"><label for="current">Mevcut şifre</label><input type="password" id="current" name="current" autocomplete="current-password" required></div>
    <div class="field"><label for="new">Yeni şifre</label><input type="password" id="new" name="new" autocomplete="new-password" minlength="8" required><div class="hint">En az 8 karakter.</div></div>
    <div class="field"><label for="new2">Yeni şifre (tekrar)</label><input type="password" id="new2" name="new2" autocomplete="new-password" minlength="8" required></div>
    <button class="btn primary">Değiştir</button>
  </form>
</div>
{% endblock %}
