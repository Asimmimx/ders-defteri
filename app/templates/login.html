<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Giriş · Ödeme Takip</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand"><span class="logo">₺</span> Ödeme Takip</div>
    <p class="muted" style="text-align:center;margin-top:0">Devam etmek için giriş yapın</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">Kullanıcı adı</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Şifre</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="field"><label class="check"><input type="checkbox" name="remember" value="1" checked> Beni hatırla (30 gün)</label></div>
      <button class="btn primary block">Giriş yap</button>
    </form>
  </div>
</div>
</body>
</html>
